<style>
/* Tema ceria: Living Coral, Illuminating, Greenery, Very Peri, Peach Fuzz, Classic Blue */
:root{
  --coral:#FF6F61; --yellow:#F5DF4D; --green:#88B04B; --peri:#6667AB; --peach:#FFBE98; --blue:#0F4C81;
  --bg:#FFF4EC; --surface:#FFFFFF; --ink:#2B2340; --muted:#7A6F86; --line:#F1E1D6;
  --ok:#4F7A22; --ok-soft:#E6F2D6; --wait:#6B5A00; --wait-soft:#FDF5C4; --blue-soft:#E3ECF5;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 8% 2%,rgba(245,223,77,.35) 0 90px,transparent 91px),radial-gradient(circle at 96% 8%,rgba(102,103,171,.18) 0 120px,transparent 121px);background-repeat:no-repeat}
.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 110px}
header{display:grid;gap:2px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--peri);font-weight:800}
h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;margin:0}
h1 .hl{background:linear-gradient(transparent 58%,var(--yellow) 58% 92%,transparent 92%);padding-inline:2px}

.periods{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:800 14px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--peri);border-color:var(--peri);color:#fff}

.summary{background:var(--coral);color:#fff;border-radius:22px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--yellow);opacity:.9}
.summary::before{content:"";position:absolute;right:60px;top:52px;width:34px;height:34px;border-radius:50%;background:var(--peach);z-index:1}
.summary>*{position:relative;z-index:2}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:50px;line-height:.9;font-variant-numeric:tabular-nums}
.big span{font-weight:700}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;background:var(--surface);border-radius:99px;transition:width .4s}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fact{display:grid;gap:1px;background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;min-width:0}
.fact small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;opacity:.9}
.fact strong{font-variant-numeric:tabular-nums;font-weight:800;overflow-wrap:anywhere}
.fact em{font-style:normal;font-size:12px;font-weight:700;opacity:.92}
.party{background:var(--green);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;margin-top:12px}

.notice{border-radius:14px;padding:12px 14px;font-size:14px;margin-block:4px 8px;display:grid;gap:8px}
.notice.local{background:var(--wait-soft);color:var(--wait)}
.notice.info{background:#ECECF7;color:var(--peri);font-weight:700}

nav.tabs{display:flex;gap:6px;margin-block:18px 12px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;background:var(--surface);border:0;border-radius:12px;padding:9px 14px;font:800 14px var(--f-body);color:var(--muted);cursor:pointer;box-shadow:0 2px 0 var(--line)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:none}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);padding:0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
.tools input{flex:1 1 160px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:3px;gap:2px;box-shadow:0 2px 0 var(--line)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font:800 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}

ol.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 3px 0 var(--line)}
ol.list li{border-top:1px dashed var(--line)}
ol.list li:first-child{border-top:0}
.row{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:disabled{cursor:default}
.n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--muted)}
.row.paid .n{background:var(--green);color:#fff}
.nm{min-width:0;display:grid;gap:1px}
.nm b{font-weight:700;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.tag.gift{background:var(--peach);color:var(--ink)}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--wait-soft);color:var(--wait)}
.pill.now{background:var(--coral);color:#fff}
.pill.wait{background:var(--bg);color:var(--muted)}
.row.pend .pill{outline:2px dashed var(--peri);outline-offset:1px}
.empty{padding:22px;text-align:center;color:var(--muted);font-weight:700}

.card{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 3px 0 var(--line)}
pre.msg{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.5 var(--f-body);background:#F3FBE9;border-left:4px solid var(--green);border-radius:4px 12px 12px 4px;padding:14px;max-height:430px;overflow:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 16px;font:800 14px var(--f-body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.peri{background:var(--peri);border-color:var(--peri);color:#fff}
.btn.danger{color:#B3261E;border-color:#B3261E}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin:0}

/* Jadwal */
.jstat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.jstat div{background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--line);display:grid}
.jstat b{font-family:var(--f-display);font-size:26px;line-height:1}
.jstat small{font-size:12px;color:var(--muted);font-weight:700}
.group{margin-bottom:14px}
.ghead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;padding:0 4px 6px}
.ghead h3{margin:0;font-family:var(--f-display);font-size:19px;color:var(--peri)}
.ghead span{font-size:13px;color:var(--muted);font-weight:700}
.ghead .off{color:var(--coral)}
.jrow{display:grid;grid-template-columns:30px 62px 1fr auto;gap:10px;align-items:center;padding:10px 14px}
.jrow .mo{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.jrow.done{opacity:.6}
.jrow.now{background:#FFF0EE}

.scroll{overflow-x:auto;background:var(--surface);border-radius:18px;box-shadow:0 3px 0 var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px dashed var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700}
thead th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--peri);font-weight:800}
td.y{color:var(--ok);font-weight:800} td.x{color:var(--coral);font-weight:800} td.na{color:var(--line)}
tfoot td{font-weight:800;background:var(--bg)}
tfoot td:first-child{background:var(--bg)}
td.r{text-align:right}

.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;color:var(--peri)}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow input:not([type=checkbox]){flex:1 1 160px}
.mrow button{flex:none}
.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
select:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
.kas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--line);display:grid;gap:4px;border-top:6px solid var(--c)}
.kcard small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.kcard b{font-family:var(--f-display);font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kcard b.neg{color:#B3261E}
.kcard span{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.exp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;align-items:start}
.exp .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.exp .who{font-weight:800;overflow-wrap:anywhere}
.exp .ket{grid-column:1/-1;font-size:13px;color:var(--muted)}
.exp .act{grid-column:1/-1}
.cat{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--ink)}
.cat.Sakit{background:#E6E6F4;color:var(--peri)}
.cat.Duka{background:#E9E6EE;color:var(--ink)}
.cat.Sukacita{background:var(--yellow);color:var(--ink)}
.cat.Konsumsi{background:var(--ok-soft);color:var(--ok)}
.kasname{font-size:11px;font-weight:800;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFE3DF;border-radius:12px;padding:10px}

footer{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.switch{display:inline-flex;gap:8px;align-items:center;font-weight:800;cursor:pointer;background:none;border:0;color:var(--ink);font-family:var(--f-body);font-size:13px;padding:0}
.switch .t{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch .t::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"] .t{background:var(--green)}
.switch[aria-checked="true"] .t::after{left:19px}
.saving{color:var(--coral);font-weight:800}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:6;max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.confetti{display:none}}
</style>
</head>

function rb(n){n=Number(n||0);return n%1000===0?(n/1000).toLocaleString("id-ID")+"rb":rp(n)}
function fmtDate(iso){if(!iso)return "";var p=iso.split("-");return Number(p[2])+" "+BULAN[Number(p[1])-1]+" "+p[0]}
function fmtStamp(iso){var d=new Date(iso);if(!iso||isNaN(d))return "-";return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear()+", "+String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0")}
function ymLabel(ym,short){if(!ym)return "";var p=ym.split("-").map(Number);return short?BULAN[p[1]-1].slice(0,3)+" "+String(p[0]).slice(2):BULAN[p[1]-1]+" "+p[0]}
function todayYM(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function ymOf(p){return p.id.slice(1,8)}
function per(){return S.periods.find(function(p){return p.id===ui.period})||S.periods[S.periods.length-1]}
function mem(id){return S.members.find(function(m){return m.id===id})||{id:id,name:"(tanpa nama)",luar:false}}
function fee(p,m){return p.arisan+p.sosial+(m.luar?0:p.lain)}
function daysTo(iso){var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+"T00:00:00")-t)/864e5)}
function recipients(p){var y=ymOf(p);return S.members.filter(function(m){return m.dapat===y})}
function recipName(p){return recipients(p).map(function(m){return m.name}).join(", ")}
function meetingFor(ym){return S.meetings.find(function(g){return g.mulai&&g.selesai&&ym>=g.mulai&&ym<=g.selesai})}
function hasLuar(p){return p.members.some(function(id){return mem(id).luar})}
function clone(x){return JSON.parse(JSON.stringify(x))}
function hasKas(){return Array.isArray(S.expenses)}
function kons(p){return p.konsumsi==null?0:Number(p.konsumsi)||0}
function sender(){var m=String(S.bank||"").match(/a\/n\s+(.+)$/i);return m?m[1].trim():"Pengurus Arisan POH"}
function kasTotals(){
  var K={}; KAS.forEach(function(k){K[k]={inn:0,out:0,list:[]}});
  S.periods.forEach(function(p){var s=sums(p);K.Sosial.inn+=s.sIn;K["Lain-lain"].inn+=s.lIn;if(recipients(p).length)K.Konsumsi.inn+=kons(p)});
  (S.expenses||[]).forEach(function(e){var k=K[e.kas]||K.Sosial;k.out+=e.jumlah;k.list.push(e)});
  KAS.forEach(function(k){K[k].saldo=K[k].inn-K[k].out});
  return K;
}

function srvPaid(p,id){return p.paid.indexOf(id)>=0}
function isPaid(p,id){var q=pend[p.id];if(q&&Object.prototype.hasOwnProperty.call(q,id))return q[id];return srvPaid(p,id)}
function isPend(p,id){return !!(pend[p.id]&&Object.prototype.hasOwnProperty.call(pend[p.id],id))}
function savePend(){lsSet(PENDKEY,JSON.stringify(pend))}
function pendCount(){var n=0;Object.keys(pend).forEach(function(k){n+=Object.keys(pend[k]).length});return n}
function prunePend(){Object.keys(pend).forEach(function(pid){var p=S.periods.find(function(x){return x.id===pid});
  if(!p){delete pend[pid];return}
  Object.keys(pend[pid]).forEach(function(id){if(p.members.indexOf(id)<0||pend[pid][id]===srvPaid(p,id))delete pend[pid][id]});
  if(!Object.keys(pend[pid]).length)delete pend[pid]});savePend()}
function paidCount(p){return p.members.filter(function(i){return isPaid(p,i)}).length}
function sums(p){
  var r={n:0,tot:p.members.length,aIn:0,aT:0,sIn:0,sT:0,lIn:0,lT:0};
  p.members.forEach(function(id){var m=mem(id),pd=isPaid(p,id);
    r.aT+=p.arisan; r.sT+=p.sosial; if(!m.luar)r.lT+=p.lain;
    if(pd){r.n++;r.aIn+=p.arisan;r.sIn+=p.sosial;if(!m.luar)r.lIn+=p.lain}});
  r.inn=r.aIn+r.sIn+r.lIn; r.target=r.aT+r.sT+r.lT; return r;
}

/* ---------- jaringan ---------- */
function setData(d){S=d;lsSet(CACHE,JSON.stringify(d));source="live";fixPeriod();prunePend()}
function load(){
  if(!CONFIGURED){render();return}
  fetch(API_URL,{cache:"no-store"}).then(function(r){return r.json()}).then(function(res){
    if(!res.ok)throw new Error(res.error||"gagal");
    if(!valid(res.data)){ui.net="old";render();return}
    if(ui.busy||ui.saving)return; setData(res.data);ui.net="ok";render();
  }).catch(function(){ui.net="error";render()});
}
function post(body){return fetch(API_URL,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json()})}
var queue=Promise.resolve();
function send(action,params,optimistic){
  if(!admin())return;
  var snap=clone(S);
  if(optimistic)optimistic();
  ui.busy++;render();
  var body=Object.assign({action:action,pin:ui.pin},params||{});
  queue=queue.then(function(){return post(body)}).then(function(res){
    ui.busy--;
    if(res.ok&&valid(res.data)){if(!ui.busy)setData(res.data);render();return}
    if(res.error==="pin"){ui.pin="";lsDel(PINKEY);S=snap;flash("PIN tidak berlaku. Masuk ulang sebagai pengelola.");return}
    S=snap;flash("Gagal menyimpan: "+(res.error||"coba lagi"));
  }).catch(function(){ui.busy--;S=snap;flash("Gagal tersambung. Perubahan dibatalkan, coba lagi.")});
}
function saveAll(){
  if(!admin()||ui.saving)return;
  var pids=Object.keys(pend).filter(function(k){return Object.keys(pend[k]).length});
  if(!pids.length){pend={};savePend();render();return}
  var before={};S.periods.forEach(function(p){before[p.id]=p.members.length&&paidCount(p)===p.members.length});
  var i=0,last=null;ui.saving="…";render();
  (function next(){
    if(i>=pids.length){
      ui.saving="";if(last)setData(last);pend={};savePend();render();
      var p=per();if(p.members.length&&paidCount(p)===p.members.length)confetti();
      flash("Tersimpan ke Google Sheet ✓");return}
    post({action:"setPaid",pin:ui.pin,periodId:pids[i],paid:pend[pids[i]]}).then(function(res){
      if(res.ok&&valid(res.data)){last=res.data;i++;next();return}
      ui.saving="";if(last)setData(last);
      if(res.error==="pin"){ui.pin="";lsDel(PINKEY);flash("PIN tidak berlaku. Masuk ulang; tanda masih tersimpan di sini.");return}
      flash("Gagal menyimpan: "+(res.error||"coba lagi")+". Tekan Simpan lagi.");
    }).catch(function(){ui.saving="";if(last)setData(last);flash("Gagal tersambung. Tanda masih tersimpan di sini, tekan Simpan lagi.")});
  })();
}
function tryLogin(pin){
  ui.loginErr="";ui.busy++;render();
  post({action:"cekPin",pin:pin}).then(function(res){
    ui.busy--;
    if(res.ok){ui.pin=pin;lsSet(PINKEY,pin);ui.login=false;flash("Masuk sebagai pengelola")}
    else{ui.loginErr="PIN salah.";render()}
  }).catch(function(){ui.busy--;ui.loginErr="Gagal tersambung ke Google Sheet.";render()});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!ui.busy&&!ui.saving)load()});

/* ---------- pesan WA ---------- */
function feeLine(p){var j=p.arisan+p.sosial+p.lain;return rp(j)+(hasLuar(p)?" (luar Jabodetabek "+rp(p.arisan+p.sosial)+")":"")}
function meetLine(p){var g=meetingFor(ymOf(p));if(!g||!g.tempat)return "";return "Tuan rumah: "+g.tempat+(g.tanggal?" (arisan offline "+fmtDate(g.tanggal)+")":"")}
function penerimaText(p){
  var rs=recipients(p);
  if(!rs.length)return "Belum ada penerima yang dijadwalkan untuk periode "+p.label+" "+p.year+". Atur di sheet Peserta, kolom Bulan dapat.";
  var nama=rs.map(function(m){return m.name}).join(" dan "), s=sums(p), k=kons(p), g=meetingFor(ymOf(p));
  var bruto=s.aT, net=bruto-k;
  var L=["Shalom, "+nama+" dan keluarga terkasih 🙏","",
    "Puji Tuhan, bulan "+p.label+" "+p.year+" ini tiba giliran "+nama+" menerima arisan POH. Uang arisan sudah kami transfer, dengan rincian sebagai berikut:","",
    "Uang arisan: "+rp(bruto)];
  if(k>0){
    L.push("Dipotong konsumsi pertemuan: "+rp(k));
    L.push("(untuk biaya konsumsi pertemuan arisan 3 bulan sekali, diserahkan kepada tuan rumah"+(g&&g.tempat?" – "+g.tempat:"")+")");
    L.push("*Jumlah yang ditransfer: "+rp(net)+"*");
  }else L.push("*Jumlah yang ditransfer: "+rp(bruto)+"*");
  L.push("","Mohon dicek, dan kabari kami bila sudah diterima ya.","",
    "Terima kasih untuk kesetiaan dan kebersamaan kita semua di arisan ini. Kiranya berkat ini menjadi sukacita dan berguna bagi "+nama+" sekeluarga. Tuhan Yesus memberkati 🙏","",
    "Salam hangat,",sender());
  return L.join("\n");
}
function waText(p){
  if(ui.mode==="rekap")return rekapText();
  if(ui.mode==="penerima")return penerimaText(p);
  var ids=p.members, s=sums(p), rc=recipName(p), ml=meetLine(p);
  if(ui.mode==="pengingat"){
    var un=ids.filter(function(i){return !isPaid(p,i)});
    if(!un.length)return "Shalom,\nPuji Tuhan, arisan POH periode "+p.label+" "+p.year+" sudah lunas semua ("+s.n+"/"+ids.length+").\nTerima kasih semuanya 🙏";
    var L=["Shalom,","Pengingat uang arisan POH","Periode: "+p.label+" "+p.year,"Due date : "+fmtDate(p.due),"","Yang belum transfer:"];
    un.forEach(function(i,k){var m=mem(i);L.push((k+1)+". "+m.name+" – "+rp(fee(p,m)))});
    L.push("","Transfer ke:",S.bank,"","Terima kasih 🙏");
    return L.join("\n");
  }
  var M=["Shalom,","Berikut list","Uang arisan POH",feeLine(p),"Periode: "+p.label+" "+p.year,"Due date : "+fmtDate(p.due)];
  if(rc)M.push("Penerima arisan: "+rc);
  if(ml)M.push(ml);
  M.push("","Transfer ke:",S.bank,"");
  ids.forEach(function(i,k){M.push((k+1)+". "+mem(i).name+(isPaid(p,i)?" ✅":""))});
  M.push("","Sudah transfer: "+s.n+" dari "+ids.length);
  return M.join("\n");
}
function rekapText(){
  var d=new Date(), L=["Shalom,","Rekap Dana Arisan POH","Per "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear(),""];
  var T={a:0,s:0,l:0,out:0};
  S.periods.forEach(function(p){
    var s=sums(p), rc=recipName(p), un=p.members.filter(function(i){return !isPaid(p,i)});
    T.a+=s.aIn;T.s+=s.sIn;T.l+=s.lIn;T.out+=s.target-s.inn;
    L.push("*"+p.label+" "+p.year+"*");
    if(rc)L.push("Penerima: "+rc);
    L.push("Lunas: "+s.n+" dari "+s.tot+" orang");
    L.push("Uang arisan: "+rp(s.aIn)+" dari "+rp(s.aT));
    L.push("Sosial: "+rp(s.sIn)+" dari "+rp(s.sT));
    L.push("Lain-lain: "+rp(s.lIn)+" dari "+rp(s.lT));
    if(!un.length)L.push("Lunas semua ✅");
    else if(ui.rekapNames)L.push("Belum ("+un.length+"): "+un.map(function(i){return mem(i).name}).join(", "));
    else L.push("Belum: "+un.length+" orang ("+rp(s.target-s.inn)+")");
    L.push("");
  });
  L.push("*Total dana masuk: "+rp(T.a+T.s+T.l)+"*");
  L.push("Uang arisan: "+rp(T.a));
  L.push("Sosial: "+rp(T.s));
  L.push("Lain-lain: "+rp(T.l));
  if(T.out)L.push("Belum masuk: "+rp(T.out));
  if(hasKas()){
    var K=kasTotals();
    KAS.forEach(function(k){
      var x=K[k]; if(!x.inn&&!x.out)return;
      L.push("","*Kas "+k+"*","Masuk: "+rp(x.inn));
      if(x.list.length){L.push("Keluar: "+rp(x.out));
        x.list.slice().sort(function(a,b){return a.tanggal<b.tanggal?-1:1}).forEach(function(e){L.push("- "+fmtDate(e.tanggal)+" · "+e.kategori+(e.untuk?" · "+e.untuk:"")+" – "+rp(e.jumlah))})}
      L.push("Saldo: "+rp(x.saldo));
    });
  }
  L.push("","Transfer ke:",S.bank,"","Terima kasih 🙏");
  return L.join("\n");
}

/* ---------- tampilan ---------- */
var rendering=false, again=false;
function render(){
  if(rendering){again=true;return}
  rendering=true;
  try{renderNow()}finally{rendering=false}
  if(again){again=false;setTimeout(render,0)}
}
function renderNow(){
  var p=per(), s=sums(p);
  var dd=daysTo(p.due), dueTxt=dd>1?dd+" hari lagi":dd===1?"besok":dd===0?"hari ini":Math.abs(dd)+" hari lewat";
  var rc=recipName(p), g=meetingFor(ymOf(p));
  var h='<div class="wrap">';
  h+='<header><span class="eyebrow">Pomparan Ompung Halasan</span><h1>Arisan <span class="hl">POH</span></h1></header>';
  h+=statusNote();
  h+='<div class="periods" role="group" aria-label="Periode">'+S.periods.map(function(x){return '<button class="chip" data-per="'+x.id+'" aria-pressed="'+(x.id===p.id)+'">'+esc(x.label.slice(0,3))+" "+x.year+'</button>'}).join("")+'</div>';
  h+='<section class="summary"><div class="big"><b>'+s.n+'/'+s.tot+'</b><span>sudah transfer<br>'+esc(p.label)+' '+p.year+'</span></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+s.tot+'" aria-valuenow="'+s.n+'"><i style="width:'+(s.tot?s.n/s.tot*100:0)+'%"></i></div>';
  h+='<div class="facts">';
  h+='<div class="fact"><small>Terkumpul</small><strong>'+rp(s.inn)+'</strong><em>dari '+rp(s.target)+'</em></div>';
  h+='<div class="fact"><small>Due date</small><strong>'+fmtDate(p.due)+'</strong><em>'+dueTxt+'</em></div>';
  if(rc)h+='<div class="fact"><small>Penerima arisan</small><strong>'+esc(rc)+'</strong><em>'+(kons(p)?'Ditransfer '+rp(s.aT-kons(p)):rp(s.aT))+'</em></div>';
  if(g&&g.tempat)h+='<div class="fact"><small>Tuan rumah</small><strong>'+esc(g.tempat)+'</strong><em>'+(g.tanggal?'Offline '+fmtDate(g.tanggal):ymLabel(g.mulai,1)+' – '+ymLabel(g.selesai,1))+'</em></div>';
  h+='</div></section>';
  if(s.tot&&s.n===s.tot)h+='<div class="party">🎉 Puji Tuhan, periode ini sudah lunas semua!</div>';
  var tabs=[["peserta","Peserta"],["wa","Kirim WA"],["kas","Kas"],["jadwal","Jadwal"],["rekap","Rekap"]]; if(admin())tabs.push(["atur","Atur"]);
  if(!admin()&&ui.tab==="atur")ui.tab="peserta";
  h+='<nav class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</nav>';
  h+= ui.tab==="peserta"?tabPeserta(p): ui.tab==="wa"?tabWA(p): ui.tab==="kas"?tabKas(): ui.tab==="jadwal"?tabJadwal(): ui.tab==="rekap"?tabRekap(): tabAtur(p);
  h+='<footer><span>'+(ui.busy?'<span class="saving">Menyimpan…</span>':'Diperbarui '+fmtStamp(S.updatedAt))+'</span>'+footerAdmin()+'</footer>';
  if(ui.login)h+=loginBox();
  h+='</div>';
  var pc=pendCount();
  if(admin()&&(pc||ui.saving))h+='<div class="savebar"><span>'+(ui.saving?'Menyimpan ke Google Sheet…':'<b>'+pc+' tanda</b> belum disimpan')+'</span><div class="btns"><button class="btn ghost" id="discardpend" '+(ui.saving?'disabled':'')+'>Batalkan</button><button class="btn primary" id="savepend" '+(ui.saving?'disabled':'')+'>Simpan ke Google Sheet</button></div></div>';
  if(ui.toast)h+='<div class="toast" role="status">'+esc(ui.toast)+'</div>';
  var a=document.activeElement, fid=a&&a.id, pos=a&&a.selectionStart;
  document.getElementById("root").innerHTML=h;
  if(fid){var f=document.getElementById(fid);if(f){f.focus();try{if(pos!=null)f.setSelectionRange(pos,pos)}catch(e){}}}
}
function statusNote(){

  if(ui.net==="old")return '<div class="notice local"><span><b>Google Sheet masih memakai Code.gs versi lama.</b> Ganti dengan Code.gs versi 2, jalankan pasangUlang, lalu Deploy → Manage deployments → New version.</span></div>';
  if(ui.net==="loading"&&source!=="live")return '<div class="notice info"><span>Memuat data terbaru dari Google Sheet…</span></div>';
  if(ui.net==="error")return '<div class="notice local"><span><b>Tidak bisa memuat data terbaru.</b> Yang tampil adalah data terakhir di perangkat ini.</span><div class="btns"><button class="btn" id="retry">Coba lagi</button></div></div>';

document.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t||(t.type==="submit"&&t.form))return;
  var p=per();
  if(t.dataset.per){ui.period=t.dataset.per;ui.confirmDel=false;render();return}

  if(t.dataset.filter){ui.filter=t.dataset.filter;render();return}
  if(t.dataset.mode){ui.mode=t.dataset.mode;render();return}
  if(t.dataset.toggle&&admin()&&!ui.saving){var id=t.dataset.toggle,now=!isPaid(p,id);
    pend[p.id]=pend[p.id]||{};
    if(now===srvPaid(p,id))delete pend[p.id][id];else pend[p.id][id]=now;
    if(!Object.keys(pend[p.id]).length)delete pend[p.id];
    savePend();render();return}
  if(t.dataset.kasf){ui.kasFilter=t.dataset.kasf;render();return}
  if(t.dataset.expask){ui.confirmExp=t.dataset.expask;render();return}

  if(t.id==="expno"){ui.confirmExp="";render();return}
  if(t.dataset.remove){var rid=t.dataset.remove;send("removeFromPeriod",{periodId:p.id,memberId:rid},function(){p.members=p.members.filter(function(x){return x!==rid});p.paid=p.paid.filter(function(x){return x!==rid})});return}
  if(t.dataset.join){var jid=t.dataset.join;send("joinPeriod",{periodId:p.id,memberId:jid},function(){p.members.push(jid)});return}
  switch(t.id){
    case "retry":ui.net="loading";render();load();return;
    case "openlogin":ui.login=!ui.login;ui.loginErr="";render();setTimeout(function(){var f=document.getElementById("pin");if(f)f.focus()},0);return;
    case "logout":ui.pin="";lsDel(PINKEY);flash("Keluar dari mode pengelola");return;
    case "copy":copyText(waText(p),"msgtext");return;
    case "rnames":ui.rekapNames=!ui.rekapNames;render();return;
    case "xlsx":exportXlsx();return;
    case "savepend":saveAll();return;
    case "discardpend":pend={};savePend();flash("Tanda yang belum disimpan dibatalkan");return;
    case "allpaid":delete pend[p.id];savePend();send("setAll",{periodId:p.id,paid:true},function(){p.paid=p.members.slice()});return;
    case "nonepaid":delete pend[p.id];savePend();send("setAll",{periodId:p.id,paid:false},function(){p.paid=[]});return;
    case "newper":var last=S.periods[S.periods.length-1].id;ui.tab="peserta";
      send("newPeriod",{},null);queue.then(function(){var np=S.periods[S.periods.length-1];if(np&&np.id!==last){ui.period=np.id;render()}});return;
    case "delper":ui.confirmDel=true;render();return;
    case "delno":ui.confirmDel=false;render();return;
    case "delyes":ui.confirmDel=false;send("deletePeriod",{periodId:p.id},function(){S.periods=S.periods.filter(function(x){return x.id!==p.id});ui.period=S.periods[S.periods.length-1].id});return;
  }
});

      var kc=document.getElementById("x-kategori");if(kc)kc.value=ui.exp.kategori;
    }
    warnSaldo();return}
  if(t.dataset&&t.dataset.rename){var m=mem(t.dataset.rename),nv=t.value.trim();if(nv&&nv!==m.name)send("rename",{memberId:m.id,name:nv},function(){m.name=nv});return}
  if(t.dataset&&t.dataset.luar){var m2=mem(t.dataset.luar),lv=t.checked;send("setRegion",{memberId:m2.id,luar:lv},function(){m2.luar=lv})}
});

render(); load();
})();
</script>
